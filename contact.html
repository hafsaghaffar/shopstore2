<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - StyleStore</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="index.html"><i class="fa-solid fa-bag-shopping"></i> StyleStore</a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
            </ul>
            <div class="nav-icons">
                <a href="#"><i class="fa-solid fa-cart-shopping"></i><span class="badge">3</span></a>
                <a href="#"><i class="fa-solid fa-user"></i></a>
            </div>
            <div class="hamburger">
                <i class="fa-solid fa-bars"></i>
            </div>
        </nav>
    </header>

    <div class="page-header">
        <h1>Contact Us</h1>
        <p>We'd love to hear from you. Get in touch with our team.</p>
    </div>

    <section class="contact-section section-padding">
        <div class="contact-container">
            <div class="contact-info">
                <h3>Get In Touch</h3>
                <p><i class="fa-solid fa-location-dot"></i> 123 Commerce St, Tech City, NY 10001</p>
                <p><i class="fa-solid fa-envelope"></i> support@stylestore.com</p>
                <p><i class="fa-solid fa-phone"></i> +1 (555) 019-2834</p>
            </div>
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" required placeholder="Write your message here..."></textarea>
                </div>
                <button type="submit" class="btn primary-btn">Send Message</button>
            </form>
        </div>
    </section>

    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 StyleStore. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
